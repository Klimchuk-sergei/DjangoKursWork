<header class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom shadow-sm">
    <a href="{% url 'mailings:home' %}" class="d-flex align-items-center text-dark text-decoration-none">
        <p class="h5 my-0 me-md-auto fw-normal">Сервис Рассылок</p>
    </a>
    <nav class="my-2 my-md-0 me-md-3">
        <a class="p-2 text-dark" href="{% url 'mailings:home' %}">Главная</a>

        {% if user.is_authenticated %}
            <a class="p-2 text-dark" href="{% url 'mailings:client_list' %}">Клиенты</a>
            <a class="p-2 text-dark" href="{% url 'mailings:message_list' %}">Сообщения</a>
            <a class="p-2 text-dark" href="{% url 'mailings:mailing_list' %}">Рассылки</a>
            <a class="p-2 text-dark" href="{% url 'users:profile' %}">Профиль</a>
        {% endif %}
    </nav>

    <div>
        {% if user.is_authenticated %}
            <form action="{% url 'users:logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger">Выйти</button>
            </form>
        {% else %}
            <a class="btn btn-outline-primary me-2" href="{% url 'users:login' %}">Войти</a>
            <a class="btn btn-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </div>
</header>
