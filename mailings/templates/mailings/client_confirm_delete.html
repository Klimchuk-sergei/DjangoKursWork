{% extends 'base.html' %}
{% block content %}
<h2 class="text-center">Удаление клиента</h2>
<hr>
<p>Вы уверены, что хотите удалить клиента "{{ object.full_name }}" ({{ object.email }})?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'mailings:client_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
