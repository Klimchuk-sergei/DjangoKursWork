{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h2">Карточка клиента: {{ object.full_name }}</h1>
</div>

<div class="card">

    <div class="card-header">
        <h5 class="card-title">Подробная информация</h5>
    </div>

    <div class="card-body">
        <p><strong>Email:</strong> {{ object.email }}</p>
        <p><strong>Комментарий:</strong></p>
        <p>{{ object.comment|linebreaks }}</p>
    </div>

    <div class="card-footer text-end">
        <a href="{% url 'mailings:client_update' object.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'mailings:client_delete' object.pk %}" class="btn btn-danger">Удалить</a>
        <a href="{% url 'mailings:client_list' %}" class="btn btn-secondary">Назад к списку</a>
    </div>

</div>
{% endblock %}
