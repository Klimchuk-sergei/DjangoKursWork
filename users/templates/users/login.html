{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-6 msx-auto">
        <div class="card">
            <div class="card=header">
                <h3 class="card-title text-center">Вход в систему</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
            </div>
            <div class="card-footer text-center">
                <small>Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
